# build script for Github (eventually)
# mainly because, I don't want to push my build dir every time I do a change, github should just build it for me
# plus, that is significantly more trust worthy (imo)

# .github/workflows/build.yml
name: Build

# .github/workflows/build.yml
name: Build Userscript

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build
        run: deno task build

      - name: Commit and push dist
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "No changes in dist/"
          else
            git commit -m "Update dist [skip ci]"
            git push
          fi