# build script for Github (eventually)
# mainly because, I don't want to push my build dir every time I do a change, github should just build it for me
# plus, that is significantly more trust worthy (imo)

# .github/workflows/build.yml
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build
        run: deno task build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/